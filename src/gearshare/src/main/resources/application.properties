# =========================
# JPA / HIBERNATE
# =========================

spring.jpa.properties.hibernate.physical_naming_strategy=com.gearshare.gearshare.config.LowerCaseNamingStrategy
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=always
spring.cache.types=simple

logging.level.org.hibernate.orm.mapping=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=INFO

# Force session tracking ONLY via cookies (disable ;JSESSIONID URL rewriting)
server.servlet.session.tracking-modes=cookie

# Local is HTTP, so do NOT require Secure cookies
server.servlet.session.cookie.secure=false

# Local should not use SameSite=None (that’s for cross-site HTTPS)
server.servlet.session.cookie.same-site=Lax

# =========================
# OAUTH2 - GOOGLE (LOCAL)
# =========================

spring.security.oauth2.client.registration.google.client-id=472011653271-v89pul1lhh0jksvfmtdbq4m28ier0ng6.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# =========================
# SESSION / COOKIE (LOCAL)
# =========================
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.max-age=3600

# =========================
# SERVER
# =========================

server.port=8080





